name: scrape

on:
  schedule:
    # UTC crons locked to Eastern Standard Time. During daylight time the same
    # run is one hour later on the Eastern clock.
    - cron: "0 13 * * *" # BOS 8:00am EST (9:00am EDT)
    - cron: "0 19 * * *" # JFK 2:00pm EST (3:00pm EDT)
    - cron: "0 3 * * *" # EWR 10:00pm EST (11:00pm EDT)
  workflow_dispatch:
    inputs:
      mode:
        description: "full or adhoc"
        required: false
        default: full
      route_id:
        description: "Route id for an ad-hoc date query"
        required: false
        default: ""
      origin:
        description: "Origin airport for an ad-hoc date query"
        required: false
        default: ""
      dest:
        description: "Destination airport"
        required: false
        default: ""
      depart:
        description: "Departure date YYYY-MM-DD"
        required: false
        default: ""
      return_date:
        description: "Return date YYYY-MM-DD"
        required: false
        default: ""
      only_origin:
        description: "Origin for a full run: BOS, JFK, EWR, or all"
        required: false
        default: all
      only_route:
        description: "Optional route id. Limits a full run to that route."
        required: false
        default: ""
      skip:
        description: "Skip this many searches already finished in today's slice"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'adhoc'
    runs-on: ubuntu-latest
    outputs:
      bos: ${{ steps.pick.outputs.bos }}
      jfk: ${{ steps.pick.outputs.jfk }}
      ewr: ${{ steps.pick.outputs.ewr }}
    steps:
      - uses: actions/checkout@v4

      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ONLY_ORIGIN: ${{ github.event.inputs.only_origin }}
          ONLY_ROUTE: ${{ github.event.inputs.only_route }}
        run: |
          python - << 'PY'
          import json, os
          from pathlib import Path
          from scraper.config import load_config
          from scraper.schedule import select_origins, select_pairs

          origins = select_origins(
              os.environ.get("EVENT_NAME", ""),
              os.environ.get("SCHEDULE", ""),
              os.environ.get("ONLY_ORIGIN", ""),
          )
          grouped = select_pairs(
              load_config(Path("config.yaml")),
              origins,
              os.environ.get("ONLY_ROUTE", ""),
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for code in ("BOS", "JFK", "EWR"):
                  rows = grouped[code]
                  if not rows:
                      rows = [{"route": "skip", "origin": code, "dest": "SKIP"}]
                  handle.write(code.lower() + "=" + json.dumps(rows, separators=(",", ":")) + "\n")
          print("running", {code: [row["dest"] for row in grouped[code]] for code in ("BOS", "JFK", "EWR")})
          PY

  bos:
    name: ${{ matrix.pair.origin }}-${{ matrix.pair.dest }}
    needs: prepare
    if: needs.prepare.result == 'success' && !contains(needs.prepare.outputs.bos || '', '"route":"skip"')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: scrape-BOS
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pair: ${{ fromJson(needs.prepare.outputs.bos || '[{"route":"skip","origin":"BOS","dest":"SKIP"}]') }}
    steps:
      - uses: ./.github/actions/scrape-pair
        if: matrix.pair.route != 'skip'
        with:
          origin: ${{ matrix.pair.origin }}
          route: ${{ matrix.pair.route }}
          dest: ${{ matrix.pair.dest }}
          skip: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip || '' }}
          token: ${{ github.token }}

  jfk:
    name: ${{ matrix.pair.origin }}-${{ matrix.pair.dest }}
    needs: prepare
    if: needs.prepare.result == 'success' && !contains(needs.prepare.outputs.jfk || '', '"route":"skip"')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: scrape-JFK
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pair: ${{ fromJson(needs.prepare.outputs.jfk || '[{"route":"skip","origin":"JFK","dest":"SKIP"}]') }}
    steps:
      - uses: ./.github/actions/scrape-pair
        if: matrix.pair.route != 'skip'
        with:
          origin: ${{ matrix.pair.origin }}
          route: ${{ matrix.pair.route }}
          dest: ${{ matrix.pair.dest }}
          skip: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip || '' }}
          token: ${{ github.token }}

  ewr:
    name: ${{ matrix.pair.origin }}-${{ matrix.pair.dest }}
    needs: prepare
    if: needs.prepare.result == 'success' && !contains(needs.prepare.outputs.ewr || '', '"route":"skip"')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: scrape-EWR
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pair: ${{ fromJson(needs.prepare.outputs.ewr || '[{"route":"skip","origin":"EWR","dest":"SKIP"}]') }}
    steps:
      - uses: ./.github/actions/scrape-pair
        if: matrix.pair.route != 'skip'
        with:
          origin: ${{ matrix.pair.origin }}
          route: ${{ matrix.pair.route }}
          dest: ${{ matrix.pair.dest }}
          skip: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip || '' }}
          token: ${{ github.token }}

  adhoc:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'adhoc'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: scrape-adhoc
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape
        id: scrape
        continue-on-error: true
        env:
          ROUTE_ID: ${{ github.event.inputs.route_id }}
          ORIGIN: ${{ github.event.inputs.origin }}
          DEST: ${{ github.event.inputs.dest }}
          DEPART: ${{ github.event.inputs.depart }}
          RETURN_DATE: ${{ github.event.inputs.return_date }}
        run: |
          args=(python -m scraper.main --route-id "$ROUTE_ID" --origin "$ORIGIN" --dest "$DEST" --depart "$DEPART")
          if [ -n "$RETURN_DATE" ]; then
            args+=(--return-date "$RETURN_DATE")
          fi
          "${args[@]}"

      - name: Commit data
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git add site/data/latest.json site/data/status.json site/data/history
          published=0
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" commit -m "data: ${{ github.event.inputs.route_id }} $(date -u +%F)"
            for attempt in 1 2 3 4; do
              git push origin HEAD:main && break
              echo "push rejected, rebasing onto main (attempt ${attempt})"
              git fetch origin main
              git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" rebase origin/main
            done
            published=1
          fi
          if [ "$published" = 1 ]; then
            gh workflow run pages.yml --ref main
          fi

  keepalive:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable scrape.yml
