name: scrape

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full or adhoc"
        required: false
        default: full
      route_id:
        description: "Route id for an ad-hoc date query"
        required: false
        default: ""
      origin:
        description: "Origin airport"
        required: false
        default: ""
      dest:
        description: "Destination airport"
        required: false
        default: ""
      depart:
        description: "Departure date YYYY-MM-DD"
        required: false
        default: ""
      return_date:
        description: "Return date YYYY-MM-DD"
        required: false
        default: ""
      only_origin:
        description: "Limit a full run to one origin: JFK, EWR, or BOS"
        required: false
        default: ""
      skip:
        description: "Skip this many searches already finished in today's slice"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'adhoc' && 'scrape-adhoc' || 'scrape' }}
  cancel-in-progress: false

jobs:
  routes:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'adhoc'
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.list.outputs.legs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install PyYAML==6.0.3

      - id: list
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python -m scraper.queue init --run-id "$RUN_ID" --run-url "$RUN_URL"
          python - << 'PY'
          import json, os
          queue = json.load(open("site/data/queue.json"))
          legs = [{"route": leg["route"], "origin": leg["origin"], "dest": leg["dest"]} for leg in queue["legs"]]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("legs=" + json.dumps(legs) + "\n")
          PY
          git add site/data/queue.json
          published=0
          if git diff --cached --quiet; then
            echo "Queue already current"
          else
            git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" commit -m "queue: start"
            git push origin HEAD:main || {
              git fetch origin main
              git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" rebase origin/main
              git push origin HEAD:main
            }
            published=1
          fi
          if [ "$published" = 1 ]; then
            gh workflow run pages.yml --ref main
          fi

  scrape:
    name: ${{ matrix.leg.origin }}-${{ matrix.leg.dest }}
    needs: routes
    if: needs.routes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        leg: ${{ fromJson(needs.routes.outputs.legs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Mark running
        env:
          ROUTE: ${{ matrix.leg.route }}
          ORIGIN: ${{ matrix.leg.origin }}
          DEST: ${{ matrix.leg.dest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python -m scraper.queue mark --route "$ROUTE" --origin "$ORIGIN" --dest "$DEST" --state running
          git add site/data/queue.json
          published=0
          if git diff --cached --quiet; then
            echo "Queue already running"
          else
            git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" commit -m "queue: ${ORIGIN}-${DEST} running"
            git push origin HEAD:main || {
              git fetch origin main
              git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" rebase origin/main
              git push origin HEAD:main
            }
            published=1
          fi
          if [ "$published" = 1 ]; then
            gh workflow run pages.yml --ref main
          fi

      - name: Scrape
        id: scrape
        continue-on-error: true
        env:
          ROUTE: ${{ matrix.leg.route }}
          ORIGIN: ${{ matrix.leg.origin }}
          DEST: ${{ matrix.leg.dest }}
          SKIP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip || '' }}
        run: |
          args=(python -m scraper.main --only-route "$ROUTE" --only-origin "$ORIGIN" --only-dest "$DEST")
          if [ -n "$SKIP" ]; then
            args+=(--skip "$SKIP")
          fi
          "${args[@]}"

      - name: Commit data
        if: ${{ !cancelled() }}
        env:
          ROUTE: ${{ matrix.leg.route }}
          ORIGIN: ${{ matrix.leg.origin }}
          DEST: ${{ matrix.leg.dest }}
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          state=done
          if [ "$SCRAPE_OUTCOME" != "success" ]; then
            state=failed
          fi
          python -m scraper.queue mark --route "$ROUTE" --origin "$ORIGIN" --dest "$DEST" --state "$state"
          git add site/data/latest.json site/data/status.json site/data/history site/data/queue.json
          published=0
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" commit -m "data: ${ORIGIN}-${DEST} $(date -u +%F)"
            git push origin HEAD:main || {
              git fetch origin main
              git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" rebase origin/main
              git push origin HEAD:main
            }
            published=1
          fi
          if [ "$published" = 1 ]; then
            gh workflow run pages.yml --ref main
          fi

  adhoc:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'adhoc'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape
        id: scrape
        continue-on-error: true
        env:
          ROUTE_ID: ${{ github.event.inputs.route_id }}
          ORIGIN: ${{ github.event.inputs.origin }}
          DEST: ${{ github.event.inputs.dest }}
          DEPART: ${{ github.event.inputs.depart }}
          RETURN_DATE: ${{ github.event.inputs.return_date }}
        run: |
          args=(python -m scraper.main --route-id "$ROUTE_ID" --origin "$ORIGIN" --dest "$DEST" --depart "$DEPART")
          if [ -n "$RETURN_DATE" ]; then
            args+=(--return-date "$RETURN_DATE")
          fi
          "${args[@]}"

      - name: Commit data
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git add site/data/latest.json site/data/status.json site/data/history
          published=0
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" commit -m "data: ${{ github.event.inputs.route_id }} $(date -u +%F)"
            git push origin HEAD:main || {
              git fetch origin main
              git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" rebase origin/main
              git push origin HEAD:main
            }
            published=1
          fi
          if [ "$published" = 1 ]; then
            gh workflow run pages.yml --ref main
          fi

  keepalive:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable scrape.yml
