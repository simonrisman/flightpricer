name: scrape

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full or adhoc"
        required: false
        default: full
      route_id:
        description: "Route id for an ad-hoc date query"
        required: false
        default: ""
      origin:
        description: "Origin airport"
        required: false
        default: ""
      dest:
        description: "Destination airport"
        required: false
        default: ""
      depart:
        description: "Departure date YYYY-MM-DD"
        required: false
        default: ""
      return_date:
        description: "Return date YYYY-MM-DD"
        required: false
        default: ""
      only_origin:
        description: "Limit a full run to one origin: JFK, EWR, or BOS"
        required: false
        default: ""
      skip:
        description: "Skip this many searches already finished in today's slice"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'adhoc' && 'scrape-adhoc' || 'scrape' }}
  cancel-in-progress: false

jobs:
  origins:
    name: ${{ matrix.origin }}
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'adhoc'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        origin: [JFK, EWR, BOS]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape origin
        env:
          ORIGIN: ${{ matrix.origin }}
          SKIP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip || '' }}
        run: |
          args=(python -m scraper.origin_job --origin "$ORIGIN" --shard-dir "shards/$ORIGIN")
          if [ -n "$SKIP" ]; then
            args+=(--skip "$SKIP")
          fi
          "${args[@]}"

      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ matrix.origin }}
          path: shards/${{ matrix.origin }}
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: origins
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'adhoc') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download origin shards
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: scrape-*
          path: shards

      - name: Merge shards
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m scraper.shard merge --shards shards --run-id "$RUN_ID" --run-url "$RUN_URL"

      - name: Commit data
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git add site/data/latest.json site/data/status.json site/data/history site/data/queue.json
          published=0
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" commit -m "data: origins $(date -u +%F)"
            git push origin HEAD:main || {
              git fetch origin main
              git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" rebase origin/main
              git push origin HEAD:main
            }
            published=1
          fi
          if [ "$published" = 1 ]; then
            gh workflow run pages.yml --ref main
          fi

  adhoc:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'adhoc'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape
        id: scrape
        continue-on-error: true
        env:
          ROUTE_ID: ${{ github.event.inputs.route_id }}
          ORIGIN: ${{ github.event.inputs.origin }}
          DEST: ${{ github.event.inputs.dest }}
          DEPART: ${{ github.event.inputs.depart }}
          RETURN_DATE: ${{ github.event.inputs.return_date }}
        run: |
          args=(python -m scraper.main --route-id "$ROUTE_ID" --origin "$ORIGIN" --dest "$DEST" --depart "$DEPART")
          if [ -n "$RETURN_DATE" ]; then
            args+=(--return-date "$RETURN_DATE")
          fi
          "${args[@]}"

      - name: Commit data
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git add site/data/latest.json site/data/status.json site/data/history
          published=0
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" commit -m "data: ${{ github.event.inputs.route_id }} $(date -u +%F)"
            git push origin HEAD:main || {
              git fetch origin main
              git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" rebase origin/main
              git push origin HEAD:main
            }
            published=1
          fi
          if [ "$published" = 1 ]; then
            gh workflow run pages.yml --ref main
          fi

  keepalive:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable scrape.yml
