name: scrape

on:
  schedule:
    # UTC crons locked to Eastern Standard Time. During daylight time the same
    # run is one hour later on the Eastern clock.
    - cron: "0 13 * * *" # BOS 8:00am EST (9:00am EDT)
    - cron: "0 19 * * *" # JFK 2:00pm EST (3:00pm EDT)
    - cron: "0 3 * * *" # EWR 10:00pm EST (11:00pm EDT)
  workflow_dispatch:
    inputs:
      mode:
        description: "full or adhoc"
        required: false
        default: full
      route_id:
        description: "Route id for an ad-hoc date query"
        required: false
        default: ""
      origin:
        description: "Origin airport for an ad-hoc date query"
        required: false
        default: ""
      dest:
        description: "Destination airport"
        required: false
        default: ""
      depart:
        description: "Departure date YYYY-MM-DD"
        required: false
        default: ""
      return_date:
        description: "Return date YYYY-MM-DD"
        required: false
        default: ""
      only_origin:
        description: "Origin for a full run: BOS, JFK, EWR, or all"
        required: false
        default: all
      only_route:
        description: "Optional route id. Limits a full run to that route."
        required: false
        default: ""
      cooldown_minutes:
        description: "Minutes between routes and before retrying failed dates. Blank uses config.yaml."
        required: false
        default: ""
      skip:
        description: "Skip this many searches already finished in today's slice"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'adhoc'
    runs-on: ubuntu-latest
    outputs:
      routes: ${{ steps.pick.outputs.routes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install 'pydantic==2.12.5' 'PyYAML==6.0.3'

      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ONLY_ORIGIN: ${{ github.event.inputs.only_origin }}
          ONLY_ROUTE: ${{ github.event.inputs.only_route }}
          COOLDOWN_MINUTES: ${{ github.event.inputs.cooldown_minutes }}
        run: |
          python - << 'PY'
          import json, os
          from pathlib import Path
          from scraper.config import load_config
          from scraper.schedule import select_origins, select_pairs

          config = load_config(Path("config.yaml"))
          origins = select_origins(
              os.environ.get("EVENT_NAME", ""),
              os.environ.get("SCHEDULE", ""),
              os.environ.get("ONLY_ORIGIN", ""),
          )
          grouped = select_pairs(config, origins, os.environ.get("ONLY_ROUTE", ""))
          raw = os.environ.get("COOLDOWN_MINUTES", "").strip()
          if raw:
              try:
                  minutes = int(raw)
              except ValueError:
                  raise SystemExit("cooldown_minutes must be a whole number")
          else:
              minutes = config.settings.cooldown_minutes
          if minutes < 0 or minutes > 30:
              raise SystemExit("cooldown_minutes must be from 0 to 30")
          payload = {
              "bos": [row["route"] for row in grouped["BOS"]],
              "jfk": [row["route"] for row in grouped["JFK"]],
              "ewr": [row["route"] for row in grouped["EWR"]],
              "cooldown": minutes * 60,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("routes=" + json.dumps(payload, separators=(",", ":")) + "\n")
          print("running", {code: payload[code.lower()] for code in ("BOS", "JFK", "EWR")}, "cooldown", payload["cooldown"])
          PY

  bos-bog:
    name: BOS-BOG
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && contains(fromJson(needs.prepare.outputs.routes).bos, 'bog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: scrape-BOS
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/scrape-pair
        with:
          origin: BOS
          route: bog
          dest: BOG
          skip: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip || '' }}
          cooldown_seconds: ${{ fromJson(needs.prepare.outputs.routes).cooldown }}
          token: ${{ github.token }}

  bos-mde:
    name: BOS-MDE
    needs: [prepare, bos-bog]
