name: scrape

on:
  schedule:
    - cron: "17 11 * * *"
    - cron: "17 17 * * *"
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full or adhoc"
        required: false
        default: full
      route_id:
        description: "Route id for an ad-hoc date query"
        required: false
        default: ""
      origin:
        description: "Origin airport"
        required: false
        default: ""
      dest:
        description: "Destination airport"
        required: false
        default: ""
      depart:
        description: "Departure date YYYY-MM-DD"
        required: false
        default: ""
      return_date:
        description: "Return date YYYY-MM-DD"
        required: false
        default: ""
      only_origin:
        description: "Limit a full run to one origin: JFK, EWR, or BOS"
        required: false
        default: ""

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape
        id: scrape
        continue-on-error: true
        env:
          SCRAPE_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'full' }}
          ROUTE_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.route_id || '' }}
          ORIGIN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.origin || '' }}
          DEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dest || '' }}
          DEPART: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.depart || '' }}
          RETURN_DATE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.return_date || '' }}
          ONLY_ORIGIN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.only_origin || '' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCRAPE_MODE" = "adhoc" ]; then
            args=(python -m scraper.main --route-id "$ROUTE_ID" --origin "$ORIGIN" --dest "$DEST" --depart "$DEPART")
            if [ -n "$RETURN_DATE" ]; then
              args+=(--return-date "$RETURN_DATE")
            fi
            "${args[@]}"
          else
            origin="$ONLY_ORIGIN"
            if [ -z "$origin" ]; then
              case "$SCHEDULE" in
                "17 11 * * *") origin=JFK ;;
                "17 17 * * *") origin=EWR ;;
                "17 23 * * *") origin=BOS ;;
              esac
            fi
            if [ -n "$origin" ]; then
              python -m scraper.main --only-origin "$origin"
            else
              python -m scraper.main
            fi
          fi

      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git add site/data/latest.json site/data/status.json site/data/history
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" commit -m "data: $(date -u +%F)"
            git push origin HEAD:main || {
              git fetch origin main
              git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" rebase origin/main
              git push origin HEAD:main
            }
          fi

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: site

      - id: deployment
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4

  keepalive:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable scrape.yml
