    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: scrape-EWR
      cancel-in-progress: false
    steps:
      - name: Cooldown
        if: needs.ewr-mad.result == 'success' || needs.ewr-mad.result == 'failure'
        run: sleep ${{ fromJson(needs.prepare.outputs.routes).cooldown }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/scrape-pair
        with:
          origin: EWR
          route: bcn
          dest: BCN
          skip: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip || '' }}
          cooldown_seconds: ${{ fromJson(needs.prepare.outputs.routes).cooldown }}
          token: ${{ github.token }}

  ewr-tbs:
    name: EWR-TBS
    needs: [prepare, ewr-bcn]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && contains(fromJson(needs.prepare.outputs.routes).ewr, 'tbs') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: scrape-EWR
      cancel-in-progress: false
    steps:
      - name: Cooldown
        if: needs.ewr-bcn.result == 'success' || needs.ewr-bcn.result == 'failure'
        run: sleep ${{ fromJson(needs.prepare.outputs.routes).cooldown }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/scrape-pair
        with:
          origin: EWR
          route: tbs
          dest: TBS
          skip: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip || '' }}
          cooldown_seconds: ${{ fromJson(needs.prepare.outputs.routes).cooldown }}
          token: ${{ github.token }}

  ewr-pdl:
    name: EWR-PDL
    needs: [prepare, ewr-tbs]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && contains(fromJson(needs.prepare.outputs.routes).ewr, 'pdl') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: scrape-EWR
      cancel-in-progress: false
    steps:
      - name: Cooldown
        if: needs.ewr-tbs.result == 'success' || needs.ewr-tbs.result == 'failure'
        run: sleep ${{ fromJson(needs.prepare.outputs.routes).cooldown }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/scrape-pair
        with:
          origin: EWR
          route: pdl
          dest: PDL
          skip: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip || '' }}
          cooldown_seconds: ${{ fromJson(needs.prepare.outputs.routes).cooldown }}
          token: ${{ github.token }}

  ewr-fnc:
    name: EWR-FNC
    needs: [prepare, ewr-pdl]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && contains(fromJson(needs.prepare.outputs.routes).ewr, 'fnc') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: scrape-EWR
      cancel-in-progress: false
    steps:
      - name: Cooldown
        if: needs.ewr-pdl.result == 'success' || needs.ewr-pdl.result == 'failure'
        run: sleep ${{ fromJson(needs.prepare.outputs.routes).cooldown }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/scrape-pair
        with:
          origin: EWR
          route: fnc
          dest: FNC
          skip: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip || '' }}
          cooldown_seconds: ${{ fromJson(needs.prepare.outputs.routes).cooldown }}
          token: ${{ github.token }}

  adhoc:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'adhoc'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: scrape-adhoc
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape
        id: scrape
        continue-on-error: true
        env:
          ROUTE_ID: ${{ github.event.inputs.route_id }}
          ORIGIN: ${{ github.event.inputs.origin }}
          DEST: ${{ github.event.inputs.dest }}
          DEPART: ${{ github.event.inputs.depart }}
          RETURN_DATE: ${{ github.event.inputs.return_date }}
        run: |
          args=(python -m scraper.main --route-id "$ROUTE_ID" --origin "$ORIGIN" --dest "$DEST" --depart "$DEPART")
          if [ -n "$RETURN_DATE" ]; then
            args+=(--return-date "$RETURN_DATE")
          fi
          "${args[@]}"

      - name: Commit data
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git add site/data/latest.json site/data/status.json site/data/history
          published=0
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" commit -m "data: ${{ github.event.inputs.route_id }} $(date -u +%F)"
            for attempt in 1 2 3 4; do
              git push origin HEAD:main && break
              echo "push rejected, rebasing onto main (attempt ${attempt})"
              git fetch origin main
              git -c user.name="flightpricer-bot" -c user.email="flightpricer-bot@users.noreply.github.com" rebase origin/main
            done
            published=1
          fi
          if [ "$published" = 1 ]; then
            gh workflow run pages.yml --ref main
          fi

  keepalive:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable scrape.yml
